[package]
name = "hermio"
version = "0.8.0"
description = "Hermio – Automate your inbox flow. Email client for Windows 11 (IMAP, POP3, Google Workspace, calendar, on-device AI)"
authors = ["nev-minhnh"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/nev-minhnh/Hermio"
homepage = "https://github.com/nev-minhnh/Hermio"
edition = "2021"
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "io-util", "time", "fs", "process"] }
futures = "0.3"
rusqlite = { version = "0.37", features = ["bundled"] }
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std"] }
webpki-roots = "1"
rustls-native-certs = "0.8"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "hostname", "tokio1-rustls-tls"] }
mail-parser = { version = "0.11", features = ["full_encoding"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots", "json"] }
keyring = { version = "3", features = ["windows-native"] }
base64 = "0.22"
sha2 = "0.10"
getrandom = "0.2"
urlencoding = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
utf7-imap = "0.3"
mime_guess = "2"
dirs = "6"
roxmltree = "0.20"
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }
regex-lite = "0.1"
pdf-extract = "0.9"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "unwind"  # pdf-extract may panic on odd PDFs; we catch it
strip = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Foundation", "Data_Xml_Dom", "UI_Notifications"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Power", "Win32_System_SystemInformation", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_UI_Shell", "Win32_Media_Audio"] }
