name: Build Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: windows-release

      - name: Install front-end dependencies
        run: npm ci

      - name: Type-check front end
        run: npx svelte-check --threshold error

      - name: Build (NSIS installer + exe)
        env:
          # Optional repository secrets; the build works without them.
          HERMIO_GOOGLE_CLIENT_ID: ${{ secrets.HERMIO_GOOGLE_CLIENT_ID }}
          HERMIO_GOOGLE_CLIENT_SECRET: ${{ secrets.HERMIO_GOOGLE_CLIENT_SECRET }}
          HERMIO_GEMINI_KEY: ${{ secrets.HERMIO_GEMINI_KEY }}
        run: npx tauri build --bundles nsis

      - name: Package zips
        shell: pwsh
        run: |
          python scripts/package.py --release-dir src-tauri/target/release --out dist-zips --no-source
          $v = (Get-Content package.json | ConvertFrom-Json).version
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@v4
        with:
          name: Hermio-${{ env.VERSION }}-windows-x64
          path: dist-zips/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Release notes from CHANGELOG
        if: github.event_name != 'pull_request'
        shell: python
        run: |
          import os
          v = os.environ["VERSION"]
          s = open("CHANGELOG.md", encoding="utf-8").read()
          a = s.find(f"## {v}")
          body = ""
          if a >= 0:
              b = s.find("\n## ", a + 3)
              body = s[a:b if b > 0 else None].split("\n", 1)[1].strip()
          body += f"\n\n**Downloads:** `Hermio-{v}-installer.zip` (per-user installer) or `Hermio-{v}-portable.zip`. Requires Windows 10/11 with WebView2."
          open("release-notes.md", "w", encoding="utf-8").write(body)

      # Every build of main publishes (or refreshes) the release for the version in package.json.
      - name: Publish release v${{ env.VERSION }}
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Hermio ${{ env.VERSION }}
          body_path: release-notes.md
          files: dist-zips/*.zip
          fail_on_unmatched_files: true
          make_latest: true
