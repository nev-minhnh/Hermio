name: Build Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: windows-release

      - name: Install front-end dependencies
        run: npm ci

      - name: Type-check front end
        run: npx svelte-check --threshold error

      - name: Build (NSIS installer + exe)
        env:
          # Optional repository secrets; the build works without them.
          HERMIO_GOOGLE_CLIENT_ID: ${{ secrets.HERMIO_GOOGLE_CLIENT_ID }}
          HERMIO_GOOGLE_CLIENT_SECRET: ${{ secrets.HERMIO_GOOGLE_CLIENT_SECRET }}
          HERMIO_GEMINI_KEY: ${{ secrets.HERMIO_GEMINI_KEY }}
        run: npx tauri build --bundles nsis

      - name: Package zips
        shell: pwsh
        run: |
          python scripts/package.py --release-dir src-tauri/target/release --out dist-zips --no-source
          $v = (Get-Content package.json | ConvertFrom-Json).version
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@v4
        with:
          name: Hermio-${{ env.VERSION }}-windows-x64
          path: dist-zips/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Hermio ${{ env.VERSION }}
          files: dist-zips/*.zip
          generate_release_notes: true
